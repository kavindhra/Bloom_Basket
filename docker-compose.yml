services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - bloombasket_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: bloombasket-backend:local
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017/merndb
      PORT: "5000"
    ports:
      - "5000:5000"
    networks:
      - bloombasket_network

  frontend:
    image: bloombasket-frontend:local
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - bloombasket_network

volumes:
  mongodb_data:

networks:
  bloombasket_network:
    driver: bridge
